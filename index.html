<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영수증 증빙서 PDF 생성기</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>영수증 증빙서 PDF 생성기</h1>
      <p class="subtitle">
        영수증 사진(JPG/JPEG)을 올리면 크기를 맞춰 정렬한 증빙서 PDF로 만들어
        드립니다.
      </p>
    </header>

    <main class="app-main">
      <!-- 1. 업로드 영역 -->
      <section class="panel" id="upload-section" aria-labelledby="upload-title">
        <h2 id="upload-title">1. 영수증 사진 업로드</h2>
        <label class="dropzone" id="dropzone" for="file-input">
          <input
            type="file"
            id="file-input"
            accept=".jpg,.jpeg,image/jpeg"
            multiple
            hidden
          />
          <span class="dropzone-icon" aria-hidden="true">⬆</span>
          <span class="dropzone-text"
            >여기로 사진을 끌어다 놓거나
            <strong>클릭해서 선택</strong>하세요</span
          >
          <span class="dropzone-hint"
            >JPG, JPEG만 가능 · 최대 50장 · 장당 20MB 이하</span
          >
        </label>
        <p class="upload-summary" id="file-count" aria-live="polite">
          최소 1장 이상의 영수증 사진을 업로드해주세요.
        </p>
      </section>

      <!-- 2. 메타정보 + 레이아웃 옵션 -->
      <section
        class="panel"
        id="options-section"
        aria-labelledby="options-title"
      >
        <h2 id="options-title">2. 증빙서 정보</h2>
        <form class="meta-form" id="meta-form" autocomplete="off">
          <div class="field">
            <label for="meta-account">계정과목</label>
            <input
              type="text"
              id="meta-account"
              name="account"
              placeholder="예: 교통비 또는 식비"
            />
          </div>
          <div class="field">
            <label for="meta-user">사용자</label>
            <input
              type="text"
              id="meta-user"
              name="user"
              placeholder="예: 홍길동"
            />
          </div>
          <div class="field">
            <label for="meta-type">증빙구분</label>
            <select id="meta-type" name="type">
              <option value="개인카드" selected>개인카드</option>
              <option value="법인카드">법인카드</option>
            </select>
          </div>
          <div class="field">
            <label for="meta-month">증빙월</label>
            <select id="meta-month" name="month">
              <option value="1" selected>1월</option>
              <option value="2">2월</option>
              <option value="3">3월</option>
              <option value="4">4월</option>
              <option value="5">5월</option>
              <option value="6">6월</option>
              <option value="7">7월</option>
              <option value="8">8월</option>
              <option value="9">9월</option>
              <option value="10">10월</option>
              <option value="11">11월</option>
              <option value="12">12월</option>
            </select>
          </div>
          <div class="field">
            <label for="meta-total">총금액(원)</label>
            <input
              type="text"
              id="meta-total"
              name="total"
              inputmode="numeric"
              placeholder="예: 125000"
            />
          </div>
          <div class="field">
            <label for="opt-per-page">페이지당 장수</label>
            <select id="opt-per-page" name="perPage">
              <option value="3" selected>3장</option>
              <option value="4">4장</option>
              <option value="5">5장</option>
              <option value="6">6장</option>
            </select>
          </div>
        </form>
      </section>

      <!-- 상태 / 오류 표시 -->
      <div class="status" id="status" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text">이미지 정리 중...</span>
      </div>
      <div class="error" id="error" role="alert" hidden>
        <span id="error-text"></span>
        <button type="button" class="btn-link" id="error-dismiss">닫기</button>
      </div>

      <!-- 실행 버튼 -->
      <div class="actions">
        <button
          type="button"
          class="btn btn-primary"
          id="generate-btn"
          disabled
        >
          PDF로 만들기
        </button>
      </div>

      <!-- 3. 결과 -->
      <section
        class="panel"
        id="result-section"
        aria-labelledby="result-title"
        hidden
      >
        <h2 id="result-title">3. 결과 미리보기</h2>
        <iframe
          class="pdf-preview"
          id="pdf-preview"
          title="생성된 PDF 미리보기"
        ></iframe>
        <div class="actions">
          <a
            class="btn btn-primary"
            id="download-btn"
            >다운로드</a
          >
          <button type="button" class="btn" id="reset-btn">새로 만들기</button>
        </div>
      </section>
    </main>

    <!-- PDF 생성 라이브러리 (유일한 외부 리소스). integrity: 파일 변조 시 로드 차단 -->
    <script
      src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
      integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
